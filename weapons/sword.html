    stab2[11] = [0,4,4,4,4,4,4,4,4,4,4,4,4,4,4,4,4,4,4,4,4,4,1,1,1,1,1,1,1,1,3,4];

    const states = {
      idle:  [idle1, idle2, idle1, idle2],
      swing: [swing1, swing2, swing1, idle1],
      stab:  [stab1, stab2, stab1, idle1],
    };

    let currentState = 'idle';
    let frame = 0, tick = 0;
    const SPEED = 10;

    function drawFrame(grid) {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
        const v = grid[y][x];
        if (!v) continue;
        ctx.fillStyle = PAL[v];
        ctx.fillRect(x*SCALE, y*SCALE, SCALE, SCALE);
      }
    }

    function setState(s,btn) {
      currentState=s; frame=0; tick=0;
      document.getElementById('stateLabel').textContent=s;
      document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
    }

    function loop() {
      tick++;
      if (tick>=SPEED) { tick=0; frame=(frame+1)%states[currentState].length; drawFrame(states[currentState][frame]); }
      requestAnimationFrame(loop);
    }

    drawFrame(idle1);
    loop();
  </script>
</body>
</html>
